actions:
  openapiHarvested: false
  specsCount: 0
  reason: |
    Zeller runs a real, live developer program but gates all reference docs and
    API artifacts behind a free developer account. No OpenAPI/Swagger/GraphQL/
    Postman/AsyncAPI is retrievable anonymously, so none was saved. Identity plus
    the confirmed gated developer portal and the anonymous OIDC auth model were
    captured faithfully; enrichment can resume once developer-account access is
    obtained.
