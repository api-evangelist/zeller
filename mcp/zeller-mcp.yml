generated: '2026-07-24'
method: searched
status: published        # published, but auth-gated
source: https://developer.myzeller.com/app-data.json  # mcpData.docs.enabled=true
server:
  name: Zeller Developer MCP server
  kind: documentation-search        # Redocly Realm docs MCP, NOT a REST-bound tool server
  transport: http
  url: https://developer.myzeller.com/_mcp
  auth:
    type: oauth2
    gated: true
    authorization_endpoint: https://developer.myzeller.com/_mcp/oauth2/auth
