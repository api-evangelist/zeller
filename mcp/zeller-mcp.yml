    well_known: well-known/zeller-oauth-authorization-server.json
tools: []   # tools/list is OAuth-gated; anonymous POST to /_mcp returns the docs 404 shell
notes: >-
  Zeller's developer portal (Redocly Realm) ships a hosted MCP server whose purpose
  is documentation search over the gated reference docs, surfaced via config flag
  mcpData.docs.enabled. It is NOT a set of tools bound to the payments API. The live
  tools/list manifest requires an authenticated OAuth session (dynamic client
  registration is supported), so tool input schemas cannot be captured anonymously.
  No public OpenAPI exists to bind tools against, so no tool-crosswalk is emitted.
