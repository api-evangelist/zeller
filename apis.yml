    url: https://developer.myzeller.com/
- aid: zeller:zeller-online-api
  name: Zeller Online Payments API
  description: >-
    Accept payments inside web and mobile apps via Zeller's Online integration.
    Part of the Zeller Developer Suite; access to full API documentation is by
    request behind a free developer account.
  humanURL: https://www.myzeller.com/au/developer-suite
