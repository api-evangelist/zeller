name: Zeller
kind: company
description: >-
  Zeller is a Melbourne-founded Australian payments and business banking company
  (founded 2020 by former Square Australia executives Ben Pfisterer and Dominic
  Yap) that gives SMEs an integrated stack of card payment acceptance, a
  transaction account, a Mastercard debit card, and financial management tools
  in one place. As a merchant acquirer it processes in-person and online card
  payments (Visa, Mastercard, eftpos, American Express, JCB, Apple Pay, Google
  Wallet) across its Zeller Terminal hardware, Tap to Pay on mobile, and online
  checkout, positioning itself against Square and fellow ASX-adjacent acquirer
  Tyro. Zeller reached unicorn status on a 2022 Series B. Its API posture is
  developer-account-gated: the Zeller Developer Suite ships Payments SDKs
  (React, React Native, Windows .NET, Android, iOS) plus Terminal, Online, and
  Tap to Pay integration APIs, with reference documentation unlocked only after
  creating a free developer account. The developer portal authenticates through
  an Auth0 (OAuth2 / OpenID Connect) tenant; no OpenAPI specification is
  published for anonymous download.
