apis:
- aid: zeller:zeller-terminal-api
  name: Zeller Terminal API
  description: >-
    Connect point-of-sale software directly to Zeller Terminal hardware to
    initiate and manage in-person card payments. Delivered through the Zeller
    Payments SDK (React, React Native, Windows .NET, Android, iOS). Reference
    documentation is unlocked with a free Zeller Developer account; no anonymous
    OpenAPI is published.
  humanURL: https://www.myzeller.com/au/developer-suite
