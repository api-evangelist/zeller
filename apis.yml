- aid: zeller:zeller-tap-to-pay-api
  name: Zeller Tap to Pay API
  description: >-
    Accept contactless card and mobile-wallet payments on a phone with no
    separate terminal, integrated through the Zeller Payments SDK. Documentation
    is gated behind a free Zeller Developer account.
