notes: >-
  developer.myzeller.com is a Redocly Realm ("Reunite") documentation portal.
  The oauth-authorization-server document is issued by auth.cloud.redocly.com and
  backs the portal login and the hosted MCP server (authorization/token endpoints
  under /_mcp/oauth2/*). It advertises authorization_code + refresh_token +
  client_credentials grants, scopes openid/profile/email/offline_access, PKCE S256,
  and dynamic client registration (registration_endpoint /_mcp/register). This is
  the DOCS-PORTAL auth surface, not the Zeller payments API auth (which is gated
  behind a free developer account and publishes no anonymous spec).
